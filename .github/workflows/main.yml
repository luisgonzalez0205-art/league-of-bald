name: Update Sleeper standings

on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sleeper-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleeper-standings
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Calculate standings
        env:
          SLEEPER_LEAGUE_ID: ${{ vars.SLEEPER_LEAGUE_ID }}
        run: python standings.py

      - name: Build Shoulda Coulda Woulda and Performance Awards
        env:
          SLEEPER_LEAGUE_ID: ${{ vars.SLEEPER_LEAGUE_ID }}
        run: python tools.py

      - name: Check website files
        run: ls -l ../static/custom-standings.json ../static/shoulda-coulda-woulda.json ../static/performance-awards.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force standings ../static/custom-standings.json ../static/shoulda-coulda-woulda.json ../static/performance-awards.json
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Sleeper standings"
          git pull --rebase -X theirs
          git push
